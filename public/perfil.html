<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="/public/css/style.css">
    <link rel="stylesheet" href="/public/css/menu.css">

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">

    <link rel="icon" type="image/png" href="/public/img/Icon.png">

    <title>Meu perfil | Evel</title>
</head>

<body class="pagina-perfil">

    <main class="conteudo-perfil">

        <section class="cartao-perfil">

            <div class="icone-perfil">
                <i class="bi bi-person-fill"></i>
            </div>

            <h1>Meu perfil</h1>

            <p class="descricao-perfil">
                Confira os dados cadastrados na sua conta Evel.
            </p>

            <div class="dados-perfil">

                <div class="campo-perfil">
                    <span>Nome completo</span>
                    <p id="perfilNome">Carregando...</p>
                </div>

                <div class="campo-perfil">
                    <span>E-mail</span>
                    <p id="perfilEmail">Carregando...</p>
                </div>

            </div>


            <div class="acoes-perfil">
                <a href="/public/inicio.html" class="voltar-inicio">
                    <i class="bi bi-arrow-left"></i>
                    Voltar ao início
                </a>

                <button type="button" class="btn-sair-perfil" id="btnSairConta">
                    <i class="bi bi-box-arrow-right"></i>
                    Sair da conta
                </button>
            </div>


        </section>

    </main>

    <script type="module" src="/public/js/script.js"></script>

</body>

</html>
