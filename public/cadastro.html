<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/style.css">

    <title>Crie uma conta para continuar</title>
</head>

<body class="pagina-cadastro">

    <div class="card">

        <h1>EVEL</h1>

        <p>Crie sua conta</p>

        <div class="input-box">
            <input type="text" id="nome" placeholder=" ">
            <label for="nome">Nome <span>*</span></label>
        </div>

        <div class="input-box">
            <input type="text" id="email" placeholder=" ">
            <label for="email">Email <span>*</span></label>
        </div>

        <div class="input-box">
            <input type="type" id="senha" placeholder=" ">
            <label for="senha">Digite sua senha <span>*</span></label>
        </div>

        <div class="input-box">
            <input type="type" id="senhaconf" placeholder=" ">
            <label for="senhaconf">Confirme sua senha <span>*</span></label>
        </div>

        <button onclick="cadastrar()">
            Cadastrar
        </button>

        <p id="resultado"></p>

        <p class="loginp">
            Já tem uma conta?<a href="login.html"> Entrar</a>
        </p>

    </div>

    <script src="cadastro.js"></script>

</body>

</html>
