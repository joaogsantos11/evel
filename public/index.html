
<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Tradutor de Libras</title>


    <style>

        * {
            box-sizing: border-box;
        }


        body {
            margin: 0;

            font-family: Arial, sans-serif;

            background: #f8f8f8;

            color: #444;
        }


        .container {

            width: 700px;

            max-width: 90%;

            margin: 100px auto;

        }


        h1 {

            color: #1019a5;

            font-size: 40px;

            margin-bottom: 10px;

        }


        .linha {

            width: 65px;

            height: 5px;

            background: red;

            border-radius: 10px;

            margin-bottom: 20px;

        }


        .descricao {

            font-size: 18px;

            margin-bottom: 20px;

        }


        /*
         * ==================================================
         * CAIXA ONDE O USUÁRIO DIGITA
         * ==================================================
         *
         * Não é textarea.
         *
         * É um elemento da própria página.
         */

        #texto {

            width: 100%;

            min-height: 175px;

            padding: 18px;

            border: 2px solid #d2d3e3;

            border-radius: 14px;

            background: white;

            font-family: Arial, sans-serif;

            font-size: 18px;

            line-height: 1.5;

            outline: none;

            white-space: pre-wrap;

            overflow-wrap: break-word;

            cursor: text;

        }


        /*
         * Borda quando estiver digitando
         */

        #texto:focus {

            border-color: #1351b4;

        }


        /*
         * Placeholder
         */

        #texto:empty::before {

            content: attr(data-placeholder);

            color: #999;

            pointer-events: none;

        }


        /*
         * ==================================================
         * BOTÕES
         * ==================================================
         */

        .botoes {

            display: flex;

            gap: 12px;

            margin-top: 15px;

        }


        button {

            padding: 13px 22px;

            border: none;

            border-radius: 8px;

            font-size: 16px;

            font-weight: bold;

            cursor: pointer;

        }


        #btnTraduzir {

            background: #1351b4;

            color: white;

        }


        #btnTraduzir:hover {

            background: #0b3f8c;

        }


        #btnLimpar {

            background: #777;

            color: white;

        }


        #btnLimpar:hover {

            background: #555;

        }


        #status {

            margin-top: 15px;

            font-size: 15px;

            color: #555;

        }

    </style>

</head>


<body>


    <main class="container">


        <h1>
            Tradutor de Libras
        </h1>


        <div class="linha"></div>


        <p class="descricao">
            Digite o texto que deseja traduzir:
        </p>


        <!--
            ==================================================
            AQUI O USUÁRIO DIGITA
            ==================================================

            O texto digitado aparece diretamente
            neste elemento da página.
        -->

        <div
            id="texto"
            contenteditable="true"
            role="textbox"
            aria-multiline="true"
            data-placeholder="Digite aqui..."
        ></div>


        <div class="botoes">


            <button
                id="btnTraduzir"
                type="button"
            >

                🤟 Traduzir para Libras

            </button>


            <button
                id="btnLimpar"
                type="button"
            >

                Limpar

            </button>


        </div>


        <div id="status"></div>


    </main>


    <!-- ==================================================
         VLibras
         ================================================== -->

    <div vw class="enabled">

        <div vw-access-button class="active"></div>

        <div vw-plugin-wrapper>

            <div class="vw-plugin-top-wrapper"></div>

        </div>

    </div>


    <script src="https://vlibras.gov.br/app/vlibras-plugin.js"></script>


    <script>


        /*
         * ==================================================
         * INICIA O VLibras
         * ==================================================
         */

        new window.VLibras.Widget(
            'https://vlibras.gov.br/app'
        );


        /*
         * ==================================================
         * ELEMENTOS
         * ==================================================
         */

        const caixa =
            document.getElementById("texto");


        const botaoTraduzir =
            document.getElementById("btnTraduzir");


        const botaoLimpar =
            document.getElementById("btnLimpar");


        const status =
            document.getElementById("status");


        /*
         * ==================================================
         * FUNÇÃO PARA PEGAR O TEXTO
         * ==================================================
         */

        function pegarTexto() {

            return caixa.innerText
                .replace(/\u00A0/g, " ")
                .trim();

        }


        /*
         * ==================================================
         * FUNÇÃO PARA SELECIONAR O TEXTO
         * ==================================================
         */

        function selecionarTexto() {


            const texto =
                pegarTexto();


            /*
             * Se não tiver texto
             */

            if (!texto) {

                status.innerText =
                    "Digite algum texto primeiro.";

                caixa.focus();

                return false;

            }


            /*
             * Pega a seleção atual da página
             */

            const selecao =
                window.getSelection();


            /*
             * Remove a seleção anterior
             */

            selecao.removeAllRanges();


            /*
             * Cria uma nova seleção
             */

            const range =
                document.createRange();


            /*
             * ==================================================
             * AQUI ESTÁ O MAIS IMPORTANTE
             * ==================================================
             *
             * Selecionamos o conteúdo REAL da caixa.
             *
             * O texto que o usuário digitou está dentro
             * desta própria página.
             */

            range.selectNodeContents(caixa);


            /*
             * Coloca a seleção na página
             */

            selecao.addRange(range);


            /*
             * Mostra no console para teste
             */

            console.log(
                "Texto selecionado:",
                selecao.toString()
            );


            /*
             * Verifica se realmente selecionou
             */

            if (
                selecao.toString().trim() === texto
            ) {

                status.innerText =
                    "Texto selecionado automaticamente.";

                return true;

            }


            status.innerText =
                "Não foi possível selecionar o texto.";

            return false;

        }


        /*
         * ==================================================
         * BOTÃO TRADUZIR
         * ==================================================
         */

        botaoTraduzir.addEventListener(
            "click",
            function () {


                /*
                 * Não fazemos cópia.
                 *
                 * Não usamos textarea.
                 *
                 * Não criamos outro texto.
                 *
                 * Selecionamos diretamente o texto
                 * que está aparecendo na página.
                 */

                selecionarTexto();


            }
        );


        /*
         * ==================================================
         * LIMPAR
         * ==================================================
         */

        botaoLimpar.addEventListener(
            "click",
            function () {


                /*
                 * Apaga o texto
                 */

                caixa.innerHTML = "";


                /*
                 * Remove seleção

                 */

                const selecao =
                    window.getSelection();


                selecao.removeAllRanges();


                /*
                 * Limpa mensagem
                 */

                status.innerText = "";


                /*
                 * Coloca cursor novamente na caixa
                 */

                caixa.focus();

            }
        );


        /*
         * ==================================================
         * CTRL + ENTER
         * ==================================================
         */

        caixa.addEventListener(
            "keydown",
            function(event) {


                if (
                    event.key === "Enter" &&
                    event.ctrlKey
                ) {

                    event.preventDefault();

                    selecionarTexto();

                }

            }
        );


    </script>


</body>

</html>
