<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Página de Login - Evel</title>
    <link rel="stylesheet" href="login.css">
</head>
<body>
    <div class="container">

    <div class="card">

        <!-- LOGIN -->
        <div class="form login-form">

            <h1>Evel</h1>
            <p>Entre na sua conta</p>

            <div class="input-box">
                <i class="fa-solid fa-envelope"></i>
                <input
                type="email"
                id="loginEmail"
                placeholder="E-mail"
                required>
            </div>

            <div class="input-box">

                <i class="fa-solid fa-lock"></i>

                <input
                type="password"
                id="loginSenha"
                placeholder="Senha"
                required>

                <i class="fa-solid fa-eye olho"
                onclick="mostrarSenha('loginSenha',this)">
                </i>

            </div>

            <button onclick="login()">
                Entrar
            </button>

            <a href="#"
            onclick="abrirEsqueci()">
            Esqueci minha senha
            </a>

            <p>
                Não possui conta?

                
                <a href="login2.html"
                <span onclick="abrirCadastro()">
                    Cadastre-se
                </span>

            </p>

        </div>


<script src="js/login.js"></script>
    
</body>
</html>
