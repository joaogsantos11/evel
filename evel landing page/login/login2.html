<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Faça seu cadastro</title>
    <link rel="stylesheet" href="login2.css">
</head>
<body>
    
</body>
</html>
        <!-- CADASTRO -->
        <div class="form cadastro-form">

            <h1>Criar Conta</h1>

            <div class="input-box">

                <i class="fa-solid fa-user"></i>

                <input
                type="text"
                id="cadNome"
                placeholder="Nome Completo">

            </div>

            <div class="input-box">

                <i class="fa-solid fa-envelope"></i>

                <input
                type="email"
                id="cadEmail"
                placeholder="E-mail">

            </div>

            <div class="input-box">

                <i class="fa-solid fa-lock"></i>

                <input
                type="password"
                id="cadSenha"
                placeholder="Senha">

                <i class="fa-solid fa-eye olho"
                onclick="mostrarSenha('cadSenha',this)">
                </i>

            </div>

            <div class="input-box">

                <i class="fa-solid fa-lock"></i>

                <input
                type="password"
                id="cadSenha2"
                placeholder="Confirmar senha">

                <i class="fa-solid fa-eye olho"
                onclick="mostrarSenha('cadSenha2',this)">
                </i>

            </div>

            <button onclick="cadastrar()">
                Cadastrar
            </button>

            <p>
                
                Já possui conta?
                
                <a href="login.html"
                <span onclick="abrirLogin()">
                    Fazer Login
                </span>

            </p>

        </div>
