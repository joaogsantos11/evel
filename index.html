<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="public/css/style.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
    <link rel="icon" type="image/png" href="/public/img/Icon.png">
    <title>EVEL</title>


</head>

<body class="pagina-inicio">

    <div id="cabecalho"></div>

    <section class="primeiratela">
        <div class="content">
            <h1>Conectando <span class="destaques">pessoas,</span> rompendo barreiras.</h1>
            <p>Tradução e ensino de Libras para<br> mais inclusão, comunicação e<br> acessibilidade.</p>
            <p>Eu, você e Libras</p>

            <div class="botoes">
                <a class="btn-traduz tamanho-igual" href="#" id="abrirLoginTraduz"><img class="btn-img"
                        src="/public/img/libras.png">Traduzir
                    agora</a>
                <a class="btn-apren tamanho-igual" href="#" id="abrirLoginAprender"><img class="btn-img"
                        src="/public/img/diplomado.png">Aprender
                    Libras</a>
            </div>
        </div>

        <div class="imagem-principal">
            <img src="/public/img/bg.png" alt="Descrição da imagem">
        </div>

    </section>

    <div class="modal-login" id="modalLogin">

        <div class="card">

            <span class="fechar-login" id="fecharLogin">&times;</span>

            <img class="logo" src="/public/img/logo.png">

            <p>Entre na sua conta</p>

            <div class="input-box">
                <input type="text" id="loginEmail" placeholder=" ">
                <label for="loginEmail">Email <span>*</span></label>
            </div>

            <div class="input-box">
                <input type="password" id="loginSenha" placeholder=" ">
                <label for="loginSenha">Sua senha <span>*</span></label>
                <i class="bi bi-eye-fill" onclick="mostrarSenha('loginSenha', this)"></i>

            </div>

            <button onclick="entrar()">
                Entrar
            </button>

            <p id="resultadoLogin"></p>

            <a class="cadastrop" href="">Esqueceu a senha?</a>

            <p class="cadastrop">
                Ainda não tem uma conta?
                <a href="#" id="abrirCadastro">Cadastre-se</a>
            </p>

        </div>

    </div>

    <div class="modal-cadastro" id="modalCadastro">

        <div class="card">

            <span class="fechar-cadastro" id="fecharCadastro">&times;</span>

            <img class="logo" src="/public/img/logo.png">

            <p>Crie sua conta</p>

            <div class="input-box">
                <input type="text" id="cadNome" placeholder=" ">
                <label for="cadNome">Nome <span>*</span></label>
            </div>

            <div class="input-box">
                <input type="text" id="cadEmail" placeholder=" ">
                <label for="cadEmail">Email <span>*</span></label>
            </div>

            <div class="input-box">
                <input type="password" id="cadSenha" placeholder=" ">
                <label for="cadSenha">Digite sua senha <span>*</span></label>
                <i class="bi bi-eye-fill" onclick="mostrarSenha('cadSenha', this)"></i>
            </div>

            <div class="input-box">
                <input type="password" id="cadSenhaConf" placeholder=" ">
                <label for="cadSenhaConf">Confirme sua senha <span>*</span></label>
                <i class="bi bi-eye-fill" onclick="mostrarSenha('cadSenhaConf', this)"></i>
            </div>

            <button onclick="cadastrar()">
                Cadastrar
            </button>

            <p id="resultadoCadastro"></p>

            <p class="loginp">
                Já tem uma conta?
                <a href="#" id="voltarLogin"> Entrar</a>
            </p>

        </div>

    </div>


<script type="module" src="public/js/script.js"></script>


</body>

</html>
